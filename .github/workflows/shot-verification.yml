name: Shot closure verification

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  closure:
    if: github.event.label.name == 'shot-closure-verification'
    name: Canonical Gauntlet and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres16:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record exact implementation SHA
        run: git rev-parse HEAD

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Install native and repository dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1 libharfbuzz0b libharfbuzz-subset0 \
            libpango-1.0-0 libpangoft2-1.0-0
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run canonical Gauntlet without substitutions
        env:
          POSTGRES16_CONTAINER: ${{ job.services.postgres16.id }}
        run: python scripts/check_dod.py all

      - name: Probe production container on fresh synthetic Supabase
        run: |
          python -c "from scripts import local_gates; local_gates.start_clean_stack()"
          python scripts/check_production_boundary.py

      - name: Restore encrypted backup into a clean PostgreSQL instance
        run: python scripts/check_restore_drill.py

      - name: Stop synthetic Supabase
        if: always()
        run: supabase stop --no-backup
