name: Dekopen CI Pipeline

on:
  push:
    branches: [main, 'shot-*']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Run lint and constitutional guards
        run: python scripts/check_dod.py lint

      - name: Run strict type checks
        run: python scripts/check_dod.py typecheck

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Run test suites
        run: python scripts/check_dod.py test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js 20.19
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '20.19'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production frontend
        run: npm run build --prefix frontend

  database-gate:
    name: Database Gate
    runs-on: ubuntu-latest
    services:
      postgres16:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Verify PostgreSQL 16 compatibility
        env:
          POSTGRES16_CONTAINER: ${{ job.services.postgres16.id }}
        run: |
          docker exec -i "$POSTGRES16_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/compat/postgres16_bootstrap.sql
          docker exec -i "$POSTGRES16_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20260901000000_initial_schema.sql
          docker exec -i "$POSTGRES16_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20260902000000_add_glazing_bead_cut_add.sql
          docker exec -i "$POSTGRES16_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/seed.sql
          docker exec -i "$POSTGRES16_CONTAINER" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/compat/postgres16_verify.sql

      - name: Run clean Supabase migration, lint and pgTAP
        run: python scripts/check_dod.py database
