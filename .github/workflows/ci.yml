name: Dekopen CI Pipeline

on:
  push:
    branches: [main, 'shot-*']
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Run lint and constitutional guards
        run: python scripts/check_dod.py lint

      - name: Run strict type checks
        run: python scripts/check_dod.py typecheck

      - name: Verify generated API tree is clean
        run: git diff --exit-code -- backend/openapi.yaml frontend/src/api/generated/

  test-suite:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          npm ci --prefix frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run test suites
        run: python scripts/check_dod.py test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Node.js 24.15
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build production frontend
        run: npm run build --prefix frontend

  database-gate:
    name: Database Gate
    runs-on: ubuntu-latest
    services:
      postgres16:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Supabase CLI 2.116.0
        uses: supabase/setup-cli@v3.0.0
        with:
          version: 2.116.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL 16, clean Supabase, RLS integration and pgTAP
        env:
          POSTGRES16_CONTAINER: ${{ job.services.postgres16.id }}
        run: python scripts/check_dod.py database
