name: Dekopen CI Pipeline

on:
  push:
    branches: [ main, 'shot-*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-guards:
    name: Lint, Quality & Constitutional Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pydantic

      - name: Check Constitutional Anti-Patterns
        run: |
          bash scripts/check_dod.sh lint

  typecheck:
    name: Strict Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy pydantic
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          fi

      - name: Run Typechecks
        run: |
          bash scripts/check_dod.sh typecheck

  test-suites:
    name: Test Suites (Engine, Backend, Frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic
          if [ -d "frontend" ] && [ -f "frontend/package.json" ]; then
            cd frontend && npm ci
          fi

      - name: Run Tests & Verify 0.00mm Tolerance
        run: |
          bash scripts/check_dod.sh test
