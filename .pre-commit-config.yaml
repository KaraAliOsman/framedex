repos:
  - repo: local
    hooks:
      - id: dekopen-lint
        name: Dekopen fail-closed lint and constitutional guards
        entry: python scripts/check_dod.py lint
        language: system
        pass_filenames: false
      - id: dekopen-typecheck
        name: Dekopen strict type checks
        entry: python scripts/check_dod.py typecheck
        language: system
        pass_filenames: false
