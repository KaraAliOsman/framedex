repos:
  - repo: local
    hooks:
      - id: ruff-mypy
        name: Ruff Lint + Mypy Engine
        entry: bash -c 'ruff check . && mypy engine/'
        language: system
        pass_filenames: false
      - id: source-guards
        name: Source guards (engine float, frontend hex, DB contract)
        entry: python scripts/check_guards.py
        language: system
        pass_filenames: false
