[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs", "generate_master_pdf.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "engine/src"
explicit_package_bases = true
warn_unreachable = true
exclude = ["^docs/"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = [".", "backend", "engine/src"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "rls_integration: requires a clean local Supabase PostgreSQL stack",
]
