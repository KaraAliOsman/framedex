      properties:
        op:
          $ref: '#/components/schemas/OperationSetFramelessOpEnum'
        module:
          type: string
          minLength: 1
          maxLength: 160
        spec:
          additionalProperties: false
          description: |-
            Glass-only module spec (mandate §14): the pane IS the module — real
            support/fitting concepts, never fake FRAME/SASH profiles. `tree` must
            still be a single BAY leaf carrying the glass spec; when `contour` is
            also set, the pane takes the contour's boundary directly (no frame
            inset exists to offset).
          properties:
            supports:
              items:
                additionalProperties: false
                description: One supported edge run of a frameless pane.
                properties:
                  kind:
                    description: How an exposed edge is held (mandate §14).
                    enum:
                    - CHANNEL
                    - CLAMPS
                    type: string
                  edge:
                    enum:
                    - left
                    - right
                    - top
                    - bottom
                    type: string
                  article_sku:
                    type: string
                  qty:
                    default: 1
                    exclusiveMinimum: true
                    type: integer
                    minimum: 0
                required:
                - kind
                - edge
                - article_sku
                type: object
              type: array
            fittings:
              items:
                additionalProperties: false
                description: |-
                  A declared fitting on the pane — patch fitting, clamp, hinge, lock,
                  connector, seal or point support, with its catalog sku and count.
                properties:
                  kind:
                    description: Counted fitting kinds of the glass-only domain (mandate
                      §14).
                    enum:
                    - PATCH_FITTING
                    - CLAMP
                    - HINGE
                    - LOCK
                    - CONNECTOR
                    - SEAL
                    - SUPPORT
                    type: string
                  sku:
                    type: string
                  qty:
                    default: 1
                    exclusiveMinimum: true
                    type: integer
                    minimum: 0
                required:
                - kind
                - sku
                type: object
              type: array
            exposed_edges:
              items:
                enum:
                - left
                - right
                - top
                - bottom
                type: string
              type: array
              nullable: true
          type: object
          nullable: true
        base_sig:
          type: string
        description:
          type: string
        result:
          type: object
          additionalProperties: true
        context_effect:
          type: object
          additionalProperties:
            type: string
