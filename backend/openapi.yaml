components:
  schemas:
    AalEnum:
      enum:
      - aal1
      - aal2
      type: string
      description: |-
        * `aal1` - aal1
        * `aal2` - aal2
    AccessoryLineRequest:
      type: object
      properties:
        obligation_id:
          type: string
          minLength: 1
          maxLength: 200
        obligation_kind:
          $ref: '#/components/schemas/ObligationKindEnum'
        technical_sku:
          type: string
          minLength: 1
          maxLength: 200
        purchasing_sku:
          type: string
          minLength: 1
          maxLength: 200
        manufacturer_name:
          type: string
          minLength: 1
          maxLength: 300
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        unit:
          allOf:
          - $ref: '#/components/schemas/AccessoryLineUnitEnum'
          default: EA
        quantity_per_position_unit:
          type: integer
          minimum: 1
        description:
          type: string
          minLength: 1
          maxLength: 1000
      required:
      - description
      - manufacturer_name
      - obligation_id
      - obligation_kind
      - order_type
      - purchasing_sku
      - quantity_per_position_unit
      - technical_sku
    AccessoryLineUnitEnum:
      enum:
      - EA
      type: string
      description: '* `EA` - EA'
    AccessoryScheduleRequest:
      type: object
      properties:
        schema_version:
          type: integer
          maximum: 1
          minimum: 1
          default: 1
        coverage:
          $ref: '#/components/schemas/CoverageEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessoryLineRequest'
      required:
      - coverage
      - items
    ActiveOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - id
      - name
      - role
    AdminResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - items
    AdminWriteRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        values:
          type: object
          additionalProperties: {}
      required:
      - reason
      - values
    AllocationRequestRequest:
      type: object
      properties:
        supplier_eligibility_id:
          type: string
          format: uuid
      required:
      - supplier_eligibility_id
    AllocationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requirement_line_id:
          type: string
          format: uuid
        supplier_eligibility_id:
          type: string
          format: uuid
      required:
      - id
      - requirement_line_id
      - supplier_eligibility_id
    AnnotationRequest:
      type: object
      properties:
        bay_id:
          type: string
          minLength: 1
        leaf_id:
          type: string
          nullable: true
          minLength: 1
        bottom_drain_holes_mm:
          type: array
          items:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        closing_points_perimeter_mm:
          type: array
          items:
            type: string
            format: decimal
            pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        continuous_width_mm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        finish_class:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/FinishClassEnum'
          - $ref: '#/components/schemas/NullEnum'
        has_coupler:
          type: boolean
          nullable: true
        measured_d1_mm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
        measured_d2_mm:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,4})?$
          nullable: true
      required:
      - bay_id
    ApplyRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        confirmed:
          type: boolean
          default: false
        reject:
          type: boolean
          default: false
      required:
      - reason
    ArtifactRequestRequest:
      type: object
      properties:
        document_type:
          $ref: '#/components/schemas/DocumentTypeEnum'
        format:
          $ref: '#/components/schemas/FormatEnum'
        project_version_id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
          nullable: true
      required:
      - document_type
      - format
      - project_version_id
    ArtifactResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        artifact_scope:
          $ref: '#/components/schemas/ArtifactScopeEnum'
        artifact_scope_id:
          type: string
          format: uuid
        document_type:
          type: string
        format:
          type: string
        bom_hash:
          type: string
          pattern: ^[0-9a-f]{64}$
        file_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        byte_size:
          type: integer
        created_at:
          type: string
          format: date-time
      required:
      - artifact_scope
      - artifact_scope_id
      - bom_hash
      - byte_size
      - created_at
      - document_type
      - file_sha256
      - format
      - id
    ArtifactScopeEnum:
      enum:
      - PROJECT_REVISION
      - ORDER
      type: string
      description: |-
        * `PROJECT_REVISION` - PROJECT_REVISION
        * `ORDER` - ORDER
    AuthMeResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        aal:
          $ref: '#/components/schemas/AalEnum'
        active_organization:
          allOf:
          - $ref: '#/components/schemas/ActiveOrganization'
          nullable: true
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - aal
      - active_organization
      - memberships
      - user
    ConfirmBatchRequestRequest:
      type: object
      properties:
        order_type:
          $ref: '#/components/schemas/OrderTypeEnum'
        confirmed:
          type: boolean
      required:
      - confirmed
      - order_type
    CoverageEnum:
      enum:
      - DECLARED
      - NONE_REQUIRED
      type: string
      description: |-
        * `DECLARED` - DECLARED
        * `NONE_REQUIRED` - NONE_REQUIRED
    CurrencyEnum:
      enum:
      - CLP
      - USD
      type: string
      description: |-
        * `CLP` - CLP
        * `USD` - USD
    CutBar:
      type: object
      properties:
        bar_index:
          type: integer
        commercial_sku:
          type: string
        material:
          $ref: '#/components/schemas/CutMaterialEnum'
        color:
          type: string
        stock_length_mm:
          type: string
        head_trim_mm:
          type: string
        tail_trim_mm:
          type: string
        kerf_mm:
          type: string
        cuts:
          type: array
          items:
            $ref: '#/components/schemas/CutPlacement'
        kerf_total_mm:
          type: string
        productive_length_mm:
          type: string
        process_consumed_mm:
          type: string
        remainder_mm:
          type: string
        waste_mm:
          type: string
        yield_pct:
          type: string
        waste_pct:
          type: string
      required:
      - bar_index
      - color
      - commercial_sku
      - cuts
      - head_trim_mm
      - kerf_mm
      - kerf_total_mm
      - material
      - process_consumed_mm
      - productive_length_mm
      - remainder_mm
      - stock_length_mm
      - tail_trim_mm
      - waste_mm
      - waste_pct
      - yield_pct
    CutMaterialEnum:
      enum:
      - PVC
      - ALUMINIUM
      - STEEL
      type: string
      description: |-
        * `PVC` - PVC
        * `ALUMINIUM` - ALUMINIUM
        * `STEEL` - STEEL
    CutPlacement:
      type: object
      properties:
        piece_id:
          type: string
        source_kind:
          $ref: '#/components/schemas/SourceKindEnum'
        workshop_sku:
          type: string
        material:
          $ref: '#/components/schemas/CutMaterialEnum'
        color:
          type: string
        length_mm:
          type: string
        source_position_id:
          type: string
          nullable: true
        bay_id:
          type: string
          nullable: true
        leaf_id:
          type: string
          nullable: true
        role:
          type: string
        unit_index:
          type: integer
        angle_left:
          type: string
          nullable: true
        angle_right:
          type: string
          nullable: true
        sequence:
          type: integer
      required:
      - angle_left
      - angle_right
      - bay_id
      - color
      - leaf_id
      - length_mm
      - material
      - piece_id
      - role
      - sequence
      - source_kind
      - source_position_id
      - unit_index
      - workshop_sku
    DecimalSeparatorEnum:
      enum:
      - .
      - ','
      type: string
      description: |-
        * `.` - .
        * `,` - ,
    DiffPreconditions:
      type: object
      properties:
        opening_width_mm:
          type: string
        bottom_drain_holes_mm:
          type: array
          items:
            type: string
      required:
      - bottom_drain_holes_mm
      - opening_width_mm
    DocumentTypeEnum:
      enum:
      - DOC-01
      - DOC-02
      - DOC-03
      - DOC-04
      - DOC-05
      - DOC-06
      - DOC-07
      type: string
      description: |-
        * `DOC-01` - DOC-01
        * `DOC-02` - DOC-02
        * `DOC-03` - DOC-03
        * `DOC-04` - DOC-04
        * `DOC-05` - DOC-05
        * `DOC-06` - DOC-06
        * `DOC-07` - DOC-07
    DocumentaryInputsRequest:
      type: object
      properties:
        payment_terms:
          type: string
          minLength: 1
          maxLength: 2000
        quotation_valid_until:
          type: string
          format: date
        positions:
          type: array
          items:
            $ref: '#/components/schemas/PositionDocumentaryInputRequest'
      required:
      - payment_terms
      - positions
      - quotation_valid_until
    DocumentaryInputsResponse:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        positions_saved:
          type: integer
      required:
      - positions_saved
      - project_id
    DocumentaryStructuralInputRequest:
      type: object
      properties:
        target_id:
          type: string
          minLength: 1
          maxLength: 200
        required_ix_cm4:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          nullable: true
        structural_basis:
          type: string
          nullable: true
          minLength: 1
          maxLength: 1000
      required:
      - target_id
    DraftPositionRequest:
      type: object
      properties:
        system_id:
          type: string
          format: uuid
        nominal_width_mm:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        nominal_height_mm:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        color:
          type: string
          minLength: 1
          maxLength: 50
        parametric_tree: {}
        position_index:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1
        typology:
          type: string
          minLength: 1
          maxLength: 50
      required:
      - color
      - nominal_height_mm
