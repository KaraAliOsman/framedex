# P08 · request → windows. Synthetic requests written for DEKOPEN (no real
# client data). Each case records what a model proposed («proposed») and the
# windows the server must accept («expected») or refuse («refused»). The
# score is the share of expected windows accepted with exact measures and
# quantity, plus zero accepted measures that the request does not state.
cases:
  - id: Q01
    request: "2 ventanas para el living de 1,20 x 1,50 y una de baño 60x60 fija"
    proposed:
      - {location: Living, width_mm: "1200", height_mm: "1500", quantity: 2}
      - {location: Baño, width_mm: "600", height_mm: "600", quantity: 1}
    expected: [Living, Baño]
    refused: []
  - id: Q02
    request: "Necesito tres correderas de 1.800 por 1.200 para el segundo piso"
    proposed:
      - {location: Segundo piso, width_mm: "1800", height_mm: "1200", quantity: 3}
    expected: [Segundo piso]
    refused: []
  - id: Q03
    request: "Cocina: ventana de 900 mm de ancho por 1100 mm de alto, oscilobatiente"
    proposed:
      - {location: Cocina, width_mm: "900", height_mm: "1100", quantity: 1}
    expected: [Cocina]
    refused: []
  - id: Q04
    request: "Dormitorio principal 150 x 120 cm abatible. Dormitorio chico 100 x 100 cm"
    proposed:
      - {location: Dormitorio principal, width_mm: "1500", height_mm: "1200", quantity: 1}
      - {location: Dormitorio chico, width_mm: "1000", height_mm: "1000", quantity: 1}
    expected: [Dormitorio principal, Dormitorio chico]
    refused: []
  - id: Q05
    request: "La puerta de la cocina mide como 90 de ancho"
    proposed:
      - {location: Puerta cocina, width_mm: "900", height_mm: "2100", quantity: 1}
    expected: []
    refused: [Puerta cocina]
  - id: Q06
    request: "Cuatro ventanas iguales de 1 x 1,2 m para las salas"
